name: Дневен преглед на пощата

on:
  schedule:
    - cron: "53 4 * * *"   # всеки ден ~06:53 зимно / ~07:53 лятно българско време
  workflow_dispatch: {}    # ръчно пускане от раздела Actions

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Изпрати прегледа
        env:
          ABV_USER: ${{ secrets.ABV_USER }}
          ABV_PASSWORD: ${{ secrets.ABV_PASSWORD }}
          FORWARD_TO: ${{ secrets.FORWARD_TO }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python digest.py
